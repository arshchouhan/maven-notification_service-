services:
  mongo-atlas-check:
    image: mongo:7
    container_name: notifications-mongo-atlas-check
    environment:
      MONGODB_URI: ${MONGODB_URI}
    command:
      - sh
      - -lc
      - |
        if [ -z "$MONGODB_URI" ]; then
          echo "MONGODB_URI is not set" >&2
          exit 1
        fi

        # Try pinging MongoDB up to 3 times using a short timeout so we fail fast
        retries=3
        delay=2
        attempt=1
        while [ "$attempt" -le "$retries" ]; do
          if timeout 5s mongosh "$MONGODB_URI" --quiet --eval 'db.runCommand({ ping: 1 })' >/dev/null 2>&1; then
            echo "Mongo ping succeeded"
            exit 0
          fi
          echo "Mongo ping attempt $attempt failed; retrying in $delay seconds..."
          attempt=$((attempt+1))
          sleep $delay
        done

        echo "Mongo ping failed after $retries attempts" >&2
        exit 1

  notifications-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notifications-service
    depends_on:
      mongo-atlas-check:
        condition: service_completed_successfully
    environment:
      MONGODB_URI: ${MONGODB_URI}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
    ports:
      - "8080:8080"
    restart: unless-stopped