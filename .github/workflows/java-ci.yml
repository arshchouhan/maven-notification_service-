name: Java CI / Build & Publish

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service
        env:
          RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}
        run: |
          if [ -z "$RENDER_SERVICE_URL" ]; then
            echo "RENDER_SERVICE_URL is not set" >&2
            exit 1
          fi

          curl -fsS "$RENDER_SERVICE_URL/health"

  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'



      - name: Build and run tests
        run: mvn -B -ntp verify

  build-and-push:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          driver: docker-container

      - name: Set sanitized image name
        run: |
          RAW_NAME='${{ github.event.repository.name }}'
          # lowercase, replace invalid chars with '-', strip trailing separators
          SANITIZED=$(echo "$RAW_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]/-/g' | sed -E 's/[-._]+$//')
          echo "IMAGE=${{ github.repository_owner }}/$SANITIZED" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE }}:${{ github.sha }}
            ghcr.io/${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish summary
        env:
          IMAGE: ghcr.io/${{ env.IMAGE }}:latest
        run: echo "Published $IMAGE"

      - name: Trigger Render deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          missing=0
          if [ -z "$RENDER_SERVICE_ID" ]; then
            echo "RENDER_SERVICE_ID is not set" >&2
            missing=1
          else
            echo "RENDER_SERVICE_ID is set"
          fi

          if [ -z "$RENDER_API_KEY" ]; then
            echo "RENDER_API_KEY is not set" >&2
            missing=1
          else
            echo "RENDER_API_KEY is set"
          fi

          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

          echo "Triggering Render deploy for $RENDER_SERVICE_ID using image ghcr.io/${IMAGE}:${GITHUB_SHA}"
          http_code=$(curl -sS -o render_response.json -w "%{http_code}" -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Accept: application/json" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"imageUrl\":\"ghcr.io/${IMAGE}:${GITHUB_SHA}\"}")

          echo "Render status code: $http_code"
          echo "Render response body:"
          cat render_response.json
          

          case "$http_code" in
            20*)
              echo "Render deploy trigger accepted"
              ;;
            *)
              echo "Render deploy trigger failed" >&2
              exit 1
              ;;
          esac

# Notes:
# - To push to Docker Hub instead, replace the login and tags with Docker Hub values
#   and add `DOCKERHUB_USERNAME` and `DOCKERHUB_TOKEN` as repository secrets.
# - Add RENDER_SERVICE_ID and RENDER_API_KEY secrets to auto-trigger deploys to Render.
